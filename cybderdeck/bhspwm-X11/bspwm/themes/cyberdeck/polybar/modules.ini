;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
 
[module/net-indicator]
type = custom/script
exec = /home/mrnngstr666/.config/bspwm/themes/cyberpunk2077/polybar/scripts/net-indicator.sh
interval = 0
tail = true
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/checknet]
type = custom/script
exec = ~/.config/bspwm/themes/cyberpunk2077/polybar/scripts/check-network
